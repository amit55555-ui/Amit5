name = "amit5"
compatibility_date = "2024-09-23"
pages_build_output_dir = "out"

# Bind the shared products KV namespace to the Pages Functions automatically,
# so no manual dashboard binding is required.
[[kv_namespaces]]
binding = "PRODUCTS_KV"
id = "ffd04385f72f49b3921bdaf9fb6c8b42"

# NOTE: The R2 bucket for uploaded media (MEDIA_BUCKET → shuk-media) is bound via
# the Cloudflare dashboard (Settings → Bindings), NOT here — declaring it in
# wrangler.toml fails the whole deploy if the bucket doesn't exist yet.

<title>שעון נוכחות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f3ee;
    --surface:#ffffff;
    --surface-2:#faf8f3;
    --border:#e3ded2;
    --border-strong:#d3ccbc;
    --ink:#23221d;
    --muted:#83795f;
    --muted-2:#a89d80;
    --accent:#2f6b63;
    --accent-strong:#1e4b45;
    --accent-soft:#e2eeec;
    --danger:#ad4a30;
    --danger-strong:#8a3a25;
    --danger-soft:#f7e7df;
    --warn-bg:#fbf1de;
    --warn-border:#d9a95a;
    --warn-text:#7a4a12;
    --shadow: 0 1px 2px rgba(35,34,29,.04), 0 6px 20px -8px rgba(35,34,29,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181a;
      --surface:#1b2123;
      --surface-2:#1f2628;
      --border:#2c3436;
      --border-strong:#3a4345;
      --ink:#ece8dd;
      --muted:#9aa19a;
      --muted-2:#6f7873;
      --accent:#6bbcac;
      --accent-strong:#8fd0c2;
      --accent-soft:#1e3532;
      --danger:#e08765;
      --danger-strong:#eda184;
      --danger-soft:#3a2419;
      --warn-bg:#31280f;
      --warn-border:#7d5c22;
      --warn-text:#e8c17a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181a;
    --surface:#1b2123;
    --surface-2:#1f2628;
    --border:#2c3436;
    --border-strong:#3a4345;
    --ink:#ece8dd;
    --muted:#9aa19a;
    --muted-2:#6f7873;
    --accent:#6bbcac;
    --accent-strong:#8fd0c2;
    --accent-soft:#1e3532;
    --danger:#e08765;
    --danger-strong:#eda184;
    --danger-soft:#3a2419;
    --warn-bg:#31280f;
    --warn-border:#7d5c22;
    --warn-text:#e8c17a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Heebo","Segoe UI",Arial,sans-serif;
    direction:rtl;
    text-align:right;
    padding:28px 16px 48px;
  }
  .mono{ font-family:"JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; direction:ltr; unicode-bidi:isolate; }

  .wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

  header.top{display:flex;flex-direction:column;gap:4px;padding:0 2px}
  .eyebrow{
    font-family:"JetBrains Mono", monospace;
    font-size:.72rem;
    letter-spacing:.14em;
    color:var(--muted);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--muted-2)}
  .eyebrow .sync-dot.on{background:var(--accent)}
  h1{
    font-size:1.7rem;
    font-weight:800;
    margin:2px 0 0;
    text-wrap:balance;
    letter-spacing:-.01em;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    box-shadow:var(--shadow);
  }

  .clockface{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    padding-bottom:16px;
    margin-bottom:16px;
    border-bottom:1px dashed var(--border-strong);
  }
  .clockface .time{font-size:2rem;font-weight:600;color:var(--ink);letter-spacing:.01em}
  .clockface .date{font-size:.8rem;color:var(--muted)}

  .status-line{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .status-badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:6px 12px;
    border-radius:999px;
    font-size:.88rem;
    font-weight:600;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--muted);
  }
  .status-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--muted-2)}
  .status-badge.working{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
  .status-badge.working .dot{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent)}
  .status-since{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

  .warn-box{
    background:var(--warn-bg);
    border:1px solid var(--warn-border);
    color:var(--warn-text);
    border-radius:12px;
    padding:14px;
    font-size:.88rem;
    margin-bottom:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .warn-box .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  .btn-row{display:flex;gap:12px;flex-wrap:wrap}
  button{
    font-family:inherit;
    font-size:1rem;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:filter .15s, transform .05s, opacity .15s;
  }
  button:active{transform:scale(.98)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .btn-main{
    flex:1 1 140px;
    padding:20px 16px;
    font-size:1.2rem;
    font-weight:700;
    color:#fff;
  }
  .btn-in{background:var(--accent)}
  .btn-in:not(:disabled):hover{background:var(--accent-strong)}
  .btn-out{background:var(--danger)}
  .btn-out:not(:disabled):hover{background:var(--danger-strong)}

  .btn-secondary{
    padding:9px 14px;
    background:transparent;
    border:1px solid var(--border-strong);
    color:var(--ink);
    font-weight:600;
    font-size:.9rem;
  }
  .btn-secondary:hover{background:var(--surface-2)}

  .btn-small{
    padding:7px 12px;
    font-size:.85rem;
    font-weight:600;
    background:var(--accent);
    color:#fff;
  }
  .btn-small:not(:disabled):hover{background:var(--accent-strong)}

  input[type=text], input[type=time], input[type=date]{
    font-family:inherit;
    font-size:.95rem;
    padding:9px 11px;
    border-radius:9px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--ink);
  }
  input[type=time], input[type=date]{font-family:"JetBrains Mono",monospace}
  input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  label{font-size:.78rem;color:var(--muted);font-weight:600}
  .note-field{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .note-field input{width:100%}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
  .tab{
    padding:10px 18px;
    cursor:pointer;
    color:var(--muted);
    border-bottom:2px solid transparent;
    font-weight:700;
    font-size:.92rem;
    margin-bottom:-1px;
  }
  .tab.active{color:var(--accent-strong);border-color:var(--accent)}

  .nav-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
  .nav-row .label{font-weight:700;font-size:1rem;flex:1;text-align:center}

  table{width:100%;border-collapse:collapse;font-size:.88rem}
  th,td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:700;font-size:.74rem;letter-spacing:.03em;text-transform:uppercase}
  tr:last-child td{border-bottom:none}
  td.mono, th.mono{font-family:"JetBrains Mono",monospace}
  .today-row td{background:var(--accent-soft)}
  .empty{color:var(--muted);text-align:center;padding:28px 0;font-size:.9rem}

  .total-line{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-top:16px;padding-top:16px;border-top:1px dashed var(--border-strong);
    font-weight:700;font-size:1.05rem;
  }
  .total-line .value{font-family:"JetBrains Mono",monospace;color:var(--accent-strong)}

  .actions-top{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px}
  .entry-note{color:var(--muted);font-size:.78rem;display:block;margin-top:2px;font-family:"Heebo",sans-serif}
  .del-btn{background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:1.05rem;padding:2px 8px;border-radius:6px}
  .del-btn:hover{background:var(--danger-soft)}

  .table-scroll{overflow-x:auto}

  footer{text-align:center;color:var(--muted-2);font-size:.76rem;margin-top:6px;line-height:1.6}

  @media (max-width:480px){
    table{font-size:.8rem}
    th,td{padding:7px 4px}
    .clockface .time{font-size:1.6rem}
  }
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">בודק סנכרון…</span></div>
    <h1>שעון נוכחות</h1>
  </header>

  <div class="card">
    <div class="clockface">
      <span class="time mono" id="liveClock">--:--:--</span>
      <span class="date" id="liveDate"></span>
    </div>

    <div id="warnBox"></div>

    <div class="status-line">
      <span class="status-badge" id="statusBadge">
        <span class="dot"></span>
        <span id="statusText">טוען…</span>
      </span>
    </div>

    <div class="btn-row">
      <button class="btn-main btn-in" id="clockInBtn" disabled>כניסה</button>
      <button class="btn-main btn-out" id="clockOutBtn" disabled>יציאה</button>
    </div>
    <div class="note-field">
      <label for="noteInput">הערה (אופציונלי)</label>
      <input type="text" id="noteInput" placeholder="לדוגמה: פגישה עם לקוח" maxlength="200">
    </div>
  </div>

  <div class="card">
    <div class="tabs">
      <div class="tab active" data-tab="daily">דוח יומי</div>
      <div class="tab" data-tab="monthly">דוח חודשי</div>
    </div>

    <div id="dailyPanel">
      <div class="nav-row">
        <button class="btn-secondary" id="prevDay">‹ יום קודם</button>
        <span class="label" id="dailyLabel"></span>
        <button class="btn-secondary" id="nextDay">יום הבא ›</button>
      </div>
      <div id="dailyContent" class="table-scroll"></div>
    </div>

    <div id="monthlyPanel" style="display:none">
      <div class="nav-row">
        <button class="btn-secondary" id="prevMonth">‹ חודש קודם</button>
        <span class="label" id="monthlyLabel"></span>
        <button class="btn-secondary" id="nextMonth">חודש הבא ›</button>
      </div>
      <div class="actions-top">
        <button class="btn-small" id="exportCsvBtn">ייצוא CSV</button>
      </div>
      <div id="monthlyContent" class="table-scroll"></div>
    </div>
  </div>

  <footer id="footerNote">טוען הגדרות אחסון…</footer>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "timeTracking.v1";

  // ---------- Backend abstraction: db capability with localStorage fallback ----------

  var db = null;
  var useDb = false;
  var entriesCol = null;
  var entries = [];   // in-memory cache, always the render source
  var ready = false;
  var downloadsCap = null;

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  function loadLocal(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      var parsed = JSON.parse(raw);
      return (parsed && Array.isArray(parsed.entries)) ? parsed.entries : [];
    }catch(e){ return []; }
  }

  function saveLocal(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ version:1, entries: entries }));
  }

  function setSyncLabel(text, on){
    document.getElementById("syncLabel").textContent = text;
    document.getElementById("syncDot").classList.toggle("on", !!on);
  }

  function setFooter(text){
    document.getElementById("footerNote").textContent = text;
  }

  function initBackend(){
    if(!(window.claude && typeof window.claude.use === "function")){
      startLocalMode();
      return;
    }
    window.claude.use("db").then(function(handle){
      if(!handle){ startLocalMode(); return; }
      db = handle;
      useDb = true;
      entriesCol = db.collection("entries");
      setSyncLabel("מסונכרן בין המכשירים שלך", true);
      setFooter("הנתונים נשמרים בענן ומסונכרנים אוטומטית בין כל המכשירים שלך.");
      entriesCol.onSnapshot(function(snap){
        entries = snap.docs.map(function(d){
          var data = d.data() || {};
          return { id: d.id, clockIn: data.clockIn, clockOut: data.clockOut || null, note: data.note || "" };
        });
        ready = true;
        render();
      }, function(err){
        setSyncLabel("שגיאת סנכרון — עובד במכשיר זה בלבד", false);
        startLocalMode(true);
      });
    }).catch(function(){
      startLocalMode();
    });

    window.claude.use("downloads").then(function(handle){
      downloadsCap = handle;
    }).catch(function(){ downloadsCap = null; });
  }

  function startLocalMode(afterDbFailure){
    useDb = false;
    entries = loadLocal();
    ready = true;
    if(!afterDbFailure){
      setSyncLabel("נשמר במכשיר זה בלבד", false);
      setFooter("הדפדפן הזה אינו תומך בסנכרון ענן — הנתונים נשמרים רק במכשיר הנוכחי.");
    }
    render();
  }

  function addEntry(entry){
    if(useDb){
      entriesCol.add(entry).catch(function(){ alert("שמירת הרשומה נכשלה, נסה שוב."); });
    } else {
      entry = Object.assign({ id: uid() }, entry);
      entries.push(entry);
      saveLocal();
      render();
    }
  }

  function patchEntry(id, patch){
    if(useDb){
      db.doc("entries/" + id).update(patch).catch(function(){ alert("העדכון נכשל, נסה שוב."); });
    } else {
      var e = entries.filter(function(x){ return x.id === id; })[0];
      if(e){ Object.assign(e, patch); saveLocal(); render(); }
    }
  }

  function removeEntry(id){
    if(useDb){
      db.doc("entries/" + id).delete().catch(function(){ alert("המחיקה נכשלה, נסה שוב."); });
    } else {
      entries = entries.filter(function(x){ return x.id !== id; });
      saveLocal();
      render();
    }
  }

  // ---------- Helpers ----------

  function pad2(n){ return String(n).padStart(2,"0"); }

  function fmtTime(iso){
    var d = new Date(iso);
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }

  function fmtDateKey(d){
    return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
  }

  function dateKeyFromIso(iso){
    return fmtDateKey(new Date(iso));
  }

  function durationMs(startIso, endIso){
    return new Date(endIso).getTime() - new Date(startIso).getTime();
  }

  function fmtDuration(ms){
    if(ms < 0) ms = 0;
    var totalMin = Math.round(ms/60000);
    var h = Math.floor(totalMin/60);
    var m = totalMin % 60;
    return h + ":" + pad2(m);
  }

  function fmtHoursDecimal(ms){
    return (ms/3600000).toFixed(2);
  }

  function findOpenEntry(){
    for(var i=0;i<entries.length;i++){
      if(!entries[i].clockOut) return entries[i];
    }
    return null;
  }

  function sortedEntries(){
    return entries.slice().sort(function(a,b){
      return new Date(a.clockIn) - new Date(b.clockIn);
    });
  }

  function escapeHtml(str){
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- Live clock ----------

  var WEEKDAYS = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
  var MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];

  function tickClock(){
    var now = new Date();
    document.getElementById("liveClock").textContent =
      pad2(now.getHours()) + ":" + pad2(now.getMinutes()) + ":" + pad2(now.getSeconds());
    document.getElementById("liveDate").textContent =
      WEEKDAYS[now.getDay()] + ", " + now.getDate() + " ב" + MONTHS[now.getMonth()];
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ---------- Clock in/out ----------

  var noteInput = document.getElementById("noteInput");
  var clockInBtn = document.getElementById("clockInBtn");
  var clockOutBtn = document.getElementById("clockOutBtn");
  var statusBadge = document.getElementById("statusBadge");
  var statusText = document.getElementById("statusText");
  var warnBox = document.getElementById("warnBox");

  function isStale(entry){
    var today = fmtDateKey(new Date());
    return dateKeyFromIso(entry.clockIn) !== today;
  }

  function render(){
    if(!ready) return;
    renderStatus();
    renderDaily();
    renderMonthly();
  }

  function renderStatus(){
    var open = findOpenEntry();
    warnBox.innerHTML = "";

    if(open){
      statusBadge.classList.add("working");
      statusText.innerHTML = "בעבודה מ־<span class=\"status-since\">" + fmtTime(open.clockIn) + "</span>";
      clockInBtn.disabled = true;
      clockOutBtn.disabled = false;

      if(isStale(open)){
        var box = document.createElement("div");
        box.className = "warn-box";

        var row1 = document.createElement("div");
        row1.className = "row";
        row1.textContent = "נראה שנשארת \"בעבודה\" מתאריך " + dateKeyFromIso(open.clockIn) + " ולא נסגרה יציאה. אפשר לסגור ידנית:";
        box.appendChild(row1);

        var row2 = document.createElement("div");
        row2.className = "row";

        var dateInput = document.createElement("input");
        dateInput.type = "date";
        dateInput.value = dateKeyFromIso(open.clockIn);

        var timeInput = document.createElement("input");
        timeInput.type = "time";
        timeInput.value = "18:00";

        var closeBtn = document.createElement("button");
        closeBtn.className = "btn-small";
        closeBtn.textContent = "סגור יציאה ידנית";
        closeBtn.addEventListener("click", function(){
          var dateVal = dateInput.value;
          var timeVal = timeInput.value;
          if(!dateVal || !timeVal){
            alert("נא לבחור תאריך ושעה");
            return;
          }
          var closeIso = new Date(dateVal + "T" + timeVal + ":00").toISOString();
          if(new Date(closeIso) <= new Date(open.clockIn)){
            alert("שעת היציאה חייבת להיות אחרי שעת הכניסה");
            return;
          }
          patchEntry(open.id, { clockOut: closeIso });
        });

        row2.appendChild(dateInput);
        row2.appendChild(timeInput);
        row2.appendChild(closeBtn);
        box.appendChild(row2);

        warnBox.appendChild(box);
      }
    } else {
      statusBadge.classList.remove("working");
      statusText.textContent = "לא נוכח כרגע";
      clockInBtn.disabled = false;
      clockOutBtn.disabled = true;
    }
  }

  clockInBtn.addEventListener("click", function(){
    if(findOpenEntry()) return;
    var note = noteInput.value.trim();
    noteInput.value = "";
    addEntry({ clockIn: new Date().toISOString(), clockOut: null, note: note });
  });

  clockOutBtn.addEventListener("click", function(){
    var open = findOpenEntry();
    if(!open) return;
    var patch = { clockOut: new Date().toISOString() };
    if(!open.note && noteInput.value.trim()){
      patch.note = noteInput.value.trim();
    }
    noteInput.value = "";
    patchEntry(open.id, patch);
  });

  // ---------- Tabs ----------

  var tabs = document.querySelectorAll(".tab");
  var dailyPanel = document.getElementById("dailyPanel");
  var monthlyPanel = document.getElementById("monthlyPanel");

  tabs.forEach(function(tab){
    tab.addEventListener("click", function(){
      tabs.forEach(function(t){ t.classList.remove("active"); });
      tab.classList.add("active");
      if(tab.dataset.tab === "daily"){
        dailyPanel.style.display = "";
        monthlyPanel.style.display = "none";
      } else {
        dailyPanel.style.display = "none";
        monthlyPanel.style.display = "";
      }
    });
  });

  // ---------- Daily report ----------

  var currentDay = new Date();
  currentDay.setHours(0,0,0,0);

  function fmtDayLabel(d){
    return WEEKDAYS[d.getDay()] + ", " + d.getDate() + " ב" + MONTHS[d.getMonth()] + " " + d.getFullYear();
  }

  document.getElementById("prevDay").addEventListener("click", function(){
    currentDay.setDate(currentDay.getDate()-1);
    renderDaily();
  });
  document.getElementById("nextDay").addEventListener("click", function(){
    currentDay.setDate(currentDay.getDate()+1);
    renderDaily();
  });

  function renderDaily(){
    document.getElementById("dailyLabel").textContent = fmtDayLabel(currentDay);
    var key = fmtDateKey(currentDay);
    var dayEntries = sortedEntries().filter(function(e){
      return dateKeyFromIso(e.clockIn) === key;
    });

    var content = document.getElementById("dailyContent");
    content.innerHTML = "";

    if(dayEntries.length === 0){
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "אין רשומות ליום זה";
      content.appendChild(empty);
      return;
    }

    var table = document.createElement("table");
    table.innerHTML = "<thead><tr><th>כניסה</th><th>יציאה</th><th>משך</th><th></th></tr></thead>";
    var tbody = document.createElement("tbody");

    var totalMs = 0;
    dayEntries.forEach(function(e){
      var tr = document.createElement("tr");
      var dur = e.clockOut ? durationMs(e.clockIn, e.clockOut) : 0;
      if(e.clockOut) totalMs += dur;

      var tdIn = document.createElement("td");
      tdIn.className = "mono";
      tdIn.innerHTML = fmtTime(e.clockIn) + (e.note ? '<span class="entry-note">' + escapeHtml(e.note) + "</span>" : "");

      var tdOut = document.createElement("td");
      tdOut.className = "mono";
      tdOut.textContent = e.clockOut ? fmtTime(e.clockOut) : "פתוח";

      var tdDur = document.createElement("td");
      tdDur.className = "mono";
      tdDur.textContent = e.clockOut ? fmtDuration(dur) : "—";

      var tdDel = document.createElement("td");
      var delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.textContent = "✕";
      delBtn.title = "מחיקה";
      delBtn.addEventListener("click", function(){
        if(confirm("למחוק רשומה זו?")) removeEntry(e.id);
      });
      tdDel.appendChild(delBtn);

      tr.appendChild(tdIn);
      tr.appendChild(tdOut);
      tr.appendChild(tdDur);
      tr.appendChild(tdDel);
      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    content.appendChild(table);

    var totalLine = document.createElement("div");
    totalLine.className = "total-line";
    totalLine.innerHTML = "<span>סה\"כ שעות ליום</span><span class=\"value mono\">" + fmtDuration(totalMs) + "</span>";
    content.appendChild(totalLine);
  }

  // ---------- Monthly report ----------

  var currentMonth = new Date();
  currentMonth.setDate(1);
  currentMonth.setHours(0,0,0,0);

  document.getElementById("prevMonth").addEventListener("click", function(){
    currentMonth.setMonth(currentMonth.getMonth()-1);
    renderMonthly();
  });
  document.getElementById("nextMonth").addEventListener("click", function(){
    currentMonth.setMonth(currentMonth.getMonth()+1);
    renderMonthly();
  });

  function monthTotals(){
    var year = currentMonth.getFullYear();
    var month = currentMonth.getMonth();
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var totals = {};
    for(var d=1; d<=daysInMonth; d++){
      totals[d] = 0;
    }
    sortedEntries().forEach(function(e){
      if(!e.clockOut) return;
      var d = new Date(e.clockIn);
      if(d.getFullYear() === year && d.getMonth() === month){
        totals[d.getDate()] += durationMs(e.clockIn, e.clockOut);
      }
    });
    return { totals: totals, daysInMonth: daysInMonth, year: year, month: month };
  }

  function renderMonthly(){
    document.getElementById("monthlyLabel").textContent = MONTHS[currentMonth.getMonth()] + " " + currentMonth.getFullYear();
    var info = monthTotals();
    var content = document.getElementById("monthlyContent");
    content.innerHTML = "";

    var hasData = Object.keys(info.totals).some(function(d){ return info.totals[d] > 0; });

    if(!hasData){
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "אין נתונים לחודש זה";
      content.appendChild(empty);
      return;
    }

    var table = document.createElement("table");
    table.innerHTML = "<thead><tr><th>תאריך</th><th>יום</th><th>סה\"כ שעות</th></tr></thead>";
    var tbody = document.createElement("tbody");

    var todayKey = fmtDateKey(new Date());
    var totalMonthMs = 0;

    for(var d=1; d<=info.daysInMonth; d++){
      var ms = info.totals[d];
      totalMonthMs += ms;
      if(ms === 0) continue;

      var dateObj = new Date(info.year, info.month, d);
      var key = fmtDateKey(dateObj);
      var tr = document.createElement("tr");
      if(key === todayKey) tr.classList.add("today-row");

      tr.innerHTML = "<td class=\"mono\">" + d + "/" + (info.month+1) + "</td>" +
                      "<td>" + WEEKDAYS[dateObj.getDay()] + "</td>" +
                      "<td class=\"mono\">" + fmtDuration(ms) + "</td>";
      tbody.appendChild(tr);
    }

    table.appendChild(tbody);
    content.appendChild(table);

    var totalLine = document.createElement("div");
    totalLine.className = "total-line";
    totalLine.innerHTML = "<span>סה\"כ שעות לחודש</span><span class=\"value mono\">" + fmtDuration(totalMonthMs) + "</span>";
    content.appendChild(totalLine);
  }

  // ---------- CSV export ----------

  document.getElementById("exportCsvBtn").addEventListener("click", function(){
    var info = monthTotals();
    var rows = [["תאריך","יום בשבוע","סה\"כ שעות (עשרוני)","סה\"כ שעות"]];

    for(var d=1; d<=info.daysInMonth; d++){
      var ms = info.totals[d];
      if(ms === 0) continue;
      var dateObj = new Date(info.year, info.month, d);
      rows.push([
        fmtDateKey(dateObj),
        WEEKDAYS[dateObj.getDay()],
        fmtHoursDecimal(ms),
        fmtDuration(ms)
      ]);
    }

    var totalMs = 0;
    Object.keys(info.totals).forEach(function(k){ totalMs += info.totals[k]; });
    rows.push(["", "סה\"כ חודשי", fmtHoursDecimal(totalMs), fmtDuration(totalMs)]);

    var csv = "﻿" + rows.map(function(r){
      return r.map(function(cell){
        var s = String(cell);
        if(s.indexOf(",") !== -1 || s.indexOf('"') !== -1){
          s = '"' + s.replace(/"/g,'""') + '"';
        }
        return s;
      }).join(",");
    }).join("\r\n");

    var filename = "דוח-נוכחות-" + info.year + "-" + pad2(info.month+1) + ".csv";
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });

    if(downloadsCap){
      downloadsCap.save({ filename: filename, data: blob }).catch(function(err){
        if(err && err.code === "declined") return;
        alert("שמירת הקובץ נכשלה. נסה שוב.");
      });
    } else {
      alert("ייצוא קבצים אינו זמין בתצוגה הזו כרגע.");
    }
  });

  initBackend();
})();
</script>

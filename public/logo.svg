<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="מציאון">
  <!-- magnifying glass = "מציאה" (finding a deal) -->
  <!-- handle -->
  <rect x="61" y="61" width="30" height="15" rx="7.5" transform="rotate(45 61 61)" fill="#ffffff"/>
  <!-- lens ring (interior transparent so the gradient shows through) -->
  <circle cx="43" cy="43" r="27" stroke="#ffffff" stroke-width="10" fill="none"/>
  <!-- sparkle inside the lens: the "find" -->
  <path d="M43 27 c1.9 9.5 4.6 12.2 14.1 14.1 c-9.5 1.9 -12.2 4.6 -14.1 14.1 c-1.9 -9.5 -4.6 -12.2 -14.1 -14.1 c9.5 -1.9 12.2 -4.6 14.1 -14.1 Z" fill="#ffffff"/>
</svg>
